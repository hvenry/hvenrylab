apiVersion: 1

# Delete then recreate: pinning a UID onto the originally generated one fails startup
# with "data source not found". Dashboards reference `uid: prometheus`, so it must be stable.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
