# The library: Jellyfin serves it, Radarr/Sonarr/Bazarr name, organise and subtitle it.

services:
  jellyfin:
    image: jellyfin/jellyfin:12.0
    container_name: jellyfin
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
      - "127.0.0.1:8096:8096"
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ${MEDIA_DIR}:/media:ro # Jellyfin never needs to modify media
    environment:
      TZ: ${TZ}
      JELLYFIN_PublishedServerUrl: https://jellyfin.${DOMAIN}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia # NVENC/NVDEC transcoding
              count: all
              capabilities: [gpu]

  # Library managers only: no indexers or download client. They rename and
  # organise media already on disk, so they need the library read-write.
  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls315
    container_name: radarr
    restart: unless-stopped
    ports:
      - "127.0.0.1:7878:7878"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./data/radarr:/config
      - ${MEDIA_DIR}:/data/library

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls323
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "127.0.0.1:8989:8989"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./data/sonarr:/config
      - ${MEDIA_DIR}:/data/library

  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.0-ls363
    container_name: bazarr
    restart: unless-stopped
    ports:
      - "127.0.0.1:6767:6767"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./data/bazarr:/config
      - ${MEDIA_DIR}:/data/library
