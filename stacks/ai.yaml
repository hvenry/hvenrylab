# Local inference plus clear-rag, a grounded answerer over this repo's docs. No hosted model.
# clear-rag is deliberately not a chat app: it answers only from the corpus and
# refuses otherwise. See docs/ai.md.

services:
  # Shares the 8GB 3070 with Jellyfin and ootd-worker.
  # Not llama3.2 (3B): under the grounded prompt it emitted a bare "[3]" with
  # healthy retrieval. 7B answers and still refuses. Don't revert to save VRAM.
  ollama:
    image: ollama/ollama:0.34.0
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      TZ: ${TZ}
      # Every query embeds then generates; a limit of 1 thrashes the chat model.
      # Both resident: 5.1GB + 0.3GB of 8GB, room left for a transcode.
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ./data/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  clear-rag:
    # Local build, no published image; bump the tag on rebuild:
    #   docker build -t clear-rag:0.1.0 --target slim ~/dev/clear-rag
    image: clear-rag:0.1.0
    container_name: clear-rag
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      TZ: ${TZ}
      CLEARRAG_PORT: "8010"
      # Upstream's host.docker.internal exists because Docker on macOS has no GPU.
      CLEARRAG_OLLAMA_URL: http://ollama:11434
      CLEARRAG_CHAT_MODEL: ${CLEARRAG_CHAT_MODEL:-qwen2.5:7b}
      CLEARRAG_EMBED_MODEL: ${CLEARRAG_EMBED_MODEL:-nomic-embed-text}
      CLEARRAG_WORKSPACE: /data
      # Upstream 30m keep-alive and preload pin VRAM on a shared GPU, and idle draw on battery.
      CLEARRAG_KEEP_ALIVE: 2m
      CLEARRAG_PRELOAD: "false"
      # Below 8192 Ollama silently truncates the instructions out of the prompt.
      CLEARRAG_NUM_CTX: "8192"
    volumes:
      - ./data/clear-rag:/data
    # No corpus mount: ingest is API-only (POST /api/documents). Re-seed: docs/ai.md.
